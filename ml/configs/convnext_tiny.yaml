# ==========================================================================
# ConvNeXt-Tiny 配置（现代 CNN，batch 降到 24 以适配 8 GB 显存）
# 训练命令：python -m ml.train --config ml/configs/convnext_tiny.yaml
# ==========================================================================
model: convnext_tiny
display_name: ConvNeXt-Tiny

data_root: data/flowers-102
image_size: 224
batch_size: 24
num_workers: 0

epochs: 60
lr_backbone: 5.0e-5
lr_head: 1.0e-3
weight_decay: 0.05
label_smoothing: 0.1
grad_clip: 1.0
warmup_epochs: 3
patience: 10
eta_min: 1.0e-6

strong: false

seed: 42
device: auto
grad_accum: 1
out_dir: ml/outputs
